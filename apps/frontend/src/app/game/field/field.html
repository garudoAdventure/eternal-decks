<div class="field-container">
  @for(field of fields(); track $index; let fieldIdx = $index) {
    <div class="field">
      <div class="field-rule">
        <div class="card-m"
          [attr.data-flip-id]="'card-' + field.rule.id"
        >
          <app-card [card]="field.rule"></app-card>
        </div>
      </div>
      <div class="field-card-container">
        <div class="field-card"
          [appFieldDropZone]="fieldIdx"
          [class.valid-target]="isValidTarget(fieldIdx)"
          [class.hovered-target]="isHovered(fieldIdx)"
        >
          @for(card of field.cards; track card.id; let cardIdx = $index) {
            <div class="card-m"
              [attr.data-flip-id]="'card-' + card.id"
              (click)="onSelectFieldCard(fieldIdx, $index)"
            >
              <app-card [card]="card"></app-card>
            </div>
          }
        </div>
        <div class="field-eternal">
          @for(eternal of field.eternals; track eternal.card.id) {
            <div class="card-m"
              [class.clickable]="validFieldEternal()[fieldIdx]"
              [attr.data-flip-id]="'card-' + eternal.card.id"
              (click)="onSelectFieldEternal($index, fieldIdx, eternal.card.id)"
            >
              <app-card [card]="eternal.card"></app-card>
            </div>
          }
        </div>
      </div>
      <div class="field-bonus">
        @if (fieldIdx === 0 && campBonus() !== null) {
          <div class="card-m"
            [attr.data-flip-id]="'card-' + campBonus()!.id"
          >
            <app-card [card]="campBonus()!"></app-card>
          </div>
        }
        @if (fieldIdx === 2 && !stars()[5]) {
          <div class="star-token" id="star-5"
            [attr.data-flip-id]="'star-5'"
          ></div>
        }
      </div>
    </div>
  }
</div>
