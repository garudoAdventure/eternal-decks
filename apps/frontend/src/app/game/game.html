<div id="page">
  <div id="header">
    <span>{{ message() }}</span>
    @if (button().show) {
      <button matButton="outlined" (click)="onClickConfirmButton()">
        {{ button().string }}
      </button>
    }
  </div>
  <div id="content">
    <div id="game-board">
      <app-revive-area></app-revive-area>
      <app-jewel-area></app-jewel-area>
      <app-stage-area></app-stage-area>
      <app-field></app-field>
      <app-heart-area></app-heart-area>
      <app-river></app-river>
      <app-discard></app-discard>
      <div class="star-container">
        @for(star of stars(); track $index) {
          @if (!star) {
            <div class="star-token"
              [id]="'star-' + $index"
              [attr.data-flip-id]="'star-' + $index"
            ></div>
          }
        }
      </div>
    </div>
    <app-player-area></app-player-area>
  </div>
</div>
<app-card-preview-overlay></app-card-preview-overlay>
<app-gameover-overlay></app-gameover-overlay>
<app-stage-clear-overlay></app-stage-clear-overlay>
