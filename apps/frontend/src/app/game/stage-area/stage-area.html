<div class="star-card-container">
  @for(card of starCard(); track $index) {
    <div class="card-m"
        [attr.data-flip-id]="'card-' + card.id"
      >
      <app-card [card]="card"></app-card>
    </div>
  }
</div>
<div class="collect-star-container">
  @for (star of getStar(); track $index) {
    @if (star) {
      <div class="star-token"
        [attr.data-flip-id]="'star-' + $index"
      ></div>
    }
  }
</div>
