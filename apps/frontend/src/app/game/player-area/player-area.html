<div id="player-container">
  @for(player of players(); track $index; let playerIdx = $index) {
    <mat-card class="player"
      [class.is-valid]="validPlayer()[$index]"
      (click)="onSelectPlayer(player.id)"
    >
      <mat-card-header>
        <div class="player-token">
          <div class="token-img" [ngClass]="getColorStr(player.color)"></div>
        </div>
        <div class="player-name">{{ player.name }}</div>
      </mat-card-header>
      <mat-card-content>
        <div class="deck-info">
          <img class="deck-icon" src="/asset/deck_icon.png">
          <span class="deck-num">{{ player.deckNum }}</span>
        </div>
        <div class="hand-card">
          @for (card of player.hand; track card.id; let cardIdx = $index) {
            @if (playerIdx !== 0) {
              <div class="card-container card-m" [attr.data-flip-id]="'card-' + card.id">
                <app-card [card]="card"></app-card>
              </div>
            } @else {
              <div class="card-container card-l"
                [class.selected]="selectedCard()[cardIdx]"
                [class.is-valid]="validHandCard()[cardIdx]"
                [attr.data-flip-id]="'card-' + card.id"
                (click)="resetCardDragDistance()"
                (mouseup)="onSelectCard(cardIdx)"

                cdkDrag
                [cdkDragData]="cardIdx"
                (cdkDragStarted)="onDragStarted($event, cardIdx)"
                (cdkDragMoved)="onDragMoved($event)"
                (cdkDragEnded)="onDragEnded($event, card.id)"
              >
                <app-card [card]="card"></app-card>
                @if (card.type == CardType.ABILITY) {
                  <div class="use-btn" (click)="useCard($event, cardIdx)">
                    <mat-icon>check</mat-icon>
                  </div>
                } @else {
                  <div class="rotate-btn" (click)="rotateCard($event, cardIdx)">
                    <mat-icon>cached</mat-icon>
                  </div>
                }
              </div>
            }
          }
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
