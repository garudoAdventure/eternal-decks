<div class="card" 
  [class.flipped]="card.isBack"
  [class.isRotate]="card.isRotate"
  (mouseenter)="onMouseEnter($event)"
  (mousemove)="onMouseMove()"
  (mouseleave)="onMouseLeave()"
>
  <div class="card-face card-front"
    [style.background-image]="getCardImg(card)"
  ></div>
  <div class="card-face card-back"
    [style.background-image]="getCardBackImg(card)"
  ></div>
</div>
