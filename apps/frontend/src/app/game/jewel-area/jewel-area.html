<div class="jewel-container"
  [class.three-player]="jewels().length !== 8"
>
  @for (genJewel of jewels(); track $index){
    @if (!genJewel) {
      <div class="jewel-token"
        [id]="'jewel-' + $index"
        [attr.data-flip-id]="'jewel-' + $index"
        [class.is-valid]="validJewel()[$index]"
        (click)="onSelectJewel($index)"
      ></div>
    }
  }
  @if (!stars()[3]) {
    <div class="star-token" id="star-3"
      [attr.data-flip-id]="'star-3'"
    ></div>
  }
</div>
