<h2 mat-dialog-title>創建房間</h2>
<mat-dialog-content>
  <form [formGroup]="roomForm">
    <mat-form-field class="input-name">
      <mat-label>房間名稱</mat-label>
      <input matInput #roomName formControlName="name">
      <mat-hint align="end">{{ roomName.value.length }} / 16</mat-hint>
    </mat-form-field>
    <mat-form-field>
      <mat-label>人數</mat-label>
      <mat-select formControlName="maxPlayer">
        <mat-option [value]="2">2</mat-option>
        <mat-option [value]="3">3</mat-option>
        <mat-option [value]="4">4</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>關卡</mat-label>
      <mat-select formControlName="stage">
        <mat-option [value]="1">A</mat-option>
        <mat-option [value]="2" disabled>B</mat-option>
        <mat-option [value]="3" disabled>C</mat-option>
        <mat-option [value]="4" disabled>D</mat-option>
        <mat-option [value]="5" disabled>E</mat-option>
        <mat-option [value]="6" disabled>F</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>取消</button>
  <button matButton (click)="create()">創建</button>
</mat-dialog-actions>
